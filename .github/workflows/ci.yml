name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: unit tests
        run: python -m unittest discover -s tests -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ruff
        run: pipx run ruff check .

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: build the wheel
        run: python -m pip install build && python -m build --wheel
      - name: install it outside the repo and run it on an empty data folder
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          cd /tmp
          export TOKSCOPE_HOME=/tmp/tokscope-home
          /tmp/venv/bin/tokscope --version
          HOME=/tmp/empty-home /tmp/venv/bin/tokscope ingest
          /tmp/venv/bin/tokscope summary --by phase
          /tmp/venv/bin/tokscope report
          test -s /tmp/tokscope-home/reports/report.html

  mod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: install Claude Code (pinned to the version the mod was tested with)
        run: npm install -g @anthropic-ai/claude-code@2.1.304
      - name: validate
        run: claude plugin validate mod
      - name: mod tests
        run: claude plugin test mod
